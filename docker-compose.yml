services:
  db:
    image: postgres:16-alpine
    container_name: adpulse-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-adpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adpulse_password}
      POSTGRES_DB: ${POSTGRES_DB:-adpulse}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-adpulse} -d ${POSTGRES_DB:-adpulse}"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: adpulse-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-adpulse}:${POSTGRES_PASSWORD:-adpulse_password}@db:5432/${POSTGRES_DB:-adpulse}
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: adpulse-worker
    command: python worker.py
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-adpulse}:${POSTGRES_PASSWORD:-adpulse_password}@db:5432/${POSTGRES_DB:-adpulse}
    volumes:
      - ./backend:/app

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: adpulse-web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  pgdata:
